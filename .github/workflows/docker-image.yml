name: Build & Push Docker Images (GHCR)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- BACKEND = dossier 'elearning' ----
      - name: Build & Push backend (elearning + learning_platform)
        uses: docker/build-push-action@v6
        with:
          context: .                  # 👈 racine du repo
          file: ./elearning/Dockerfile
          push: true
          tags: |
            ghcr.io/aichabibi/inlearning-backend:latest
            ghcr.io/aichabibi/inlearning-backend:${{ github.sha }}
      


      # ---- FRONTEND = dossier 'learning_platform' (note les guillemets) ----
      - name: Build & Push frontend (learning_platform)
        uses: docker/build-push-action@v6
        with:
          context: "./learning_platform"
          file: "./learning_platform/Dockerfile"
          push: true
          tags: |
            ghcr.io/aichabibi/inlearning-frontend:latest
            ghcr.io/aichabibi/inlearning-frontend:${{ github.sha }}
